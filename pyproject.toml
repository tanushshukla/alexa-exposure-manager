[project]
name = "alexa-exposure-manager"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
test = [
  "homeassistant>=2026.6,<2026.9",
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
