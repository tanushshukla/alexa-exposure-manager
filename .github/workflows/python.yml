name: Python

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require production backend and tests
        run: |
          test -d custom_components/alexa_exposure_manager
          test -d tests

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install quality tools and Home Assistant test package
        run: >-
          python -m pip install
          ruff==0.16.2
          mypy==2.3.0
          pytest-homeassistant-custom-component==0.13.355

      - name: Ruff lint
        run: ruff check custom_components/alexa_exposure_manager tests

      - name: Ruff format
        run: ruff format --check custom_components/alexa_exposure_manager tests

      - name: Mypy
        run: >-
          mypy
          --ignore-missing-imports
          --check-untyped-defs
          custom_components/alexa_exposure_manager

  compatibility:
    name: HA ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.6.4"
            pytest_homeassistant: "0.13.340"
          - homeassistant: "2026.7.4"
            pytest_homeassistant: "0.13.348"
          - homeassistant: "2026.8.1"
            pytest_homeassistant: "0.13.355"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require production backend and tests
        run: |
          test -d custom_components/alexa_exposure_manager
          test -d tests

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install matching Home Assistant test package
        run: >-
          python -m pip install
          pytest-homeassistant-custom-component==${{ matrix.pytest_homeassistant }}

      - name: Verify resolved Home Assistant version
        env:
          EXPECTED_HOMEASSISTANT: ${{ matrix.homeassistant }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          actual = version("homeassistant")
          expected = os.environ["EXPECTED_HOMEASSISTANT"]
          if actual != expected:
              raise SystemExit(f"Expected Home Assistant {expected}, installed {actual}")
          PY

      - name: Run backend tests
        run: pytest -q tests
